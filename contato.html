<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Meu Blog Pessoal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.2em;
      margin-bottom: 5px;
    }

    header p {
      color: #bdc3c7;
      font-size: 1em;
    }

    nav {
      background-color: #34495e;
      padding: 10px 0;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #3498db;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2.titulo-pagina {
      color: #2c3e50;
      margin-bottom: 20px;
      text-align: center;
    }

    .formulario {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .formulario p.intro {
      color: #555;
      margin-bottom: 25px;
      text-align: center;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      color: #2c3e50;
      font-weight: 500;
    }

    .campo input,
    .campo textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
      font-size: 1em;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .campo input:focus,
    .campo textarea:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 5px rgba(52, 152, 219, 0.4);
    }

    .campo textarea {
      resize: vertical;
      min-height: 130px;
    }

    button.enviar {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1em;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      width: 100%;
    }

    button.enviar:hover {
      background-color: #2980b9;
    }

    .info-contato {
      margin-top: 25px;
      text-align: center;
      color: #555;
      font-size: 0.95em;
    }

    .info-contato a {
      color: #3498db;
      text-decoration: none;
    }

    .info-contato a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #2c3e50;
      color: #bdc3c7;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Professor Schneider</h1>
    <p>Reflexões, ideias e histórias do dia a dia</p>
  </header>

  <nav>

    <a href="sobre.html">Sobre</a>
    <a href="contato.html">Contato</a>
  </nav>

          <a href="https://github.com/seuperfil" target="_blank">💻 GitHub</a>

      </div>
  
  </main>

  <footer>

</body>
</html>
